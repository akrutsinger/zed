# Builds the illumos remote server and runs it on OmniOS. A standalone mirror of
# the FreeBSD build_freebsd_remote_server / bundle_freebsd jobs, using GitHub-hosted
# runners so it works on a fork.
name: illumos_remote_server
on:
  push:
    branches:
    - ci-illumos-test
  workflow_dispatch:
    inputs:
      profile:
        description: Cargo profile (dev is quicker; release is what users would get)
        type: choice
        options:
        - dev
        - release
        default: dev
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  PROFILE: ${{ inputs.profile || 'dev' }}
jobs:
  build_illumos_remote_server:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      with:
        clean: false
    - name: Free disk space
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: illumos-${{ env.PROFILE }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'script/build-remote-server-illumos') }}
        restore-keys: illumos-${{ env.PROFILE }}-
    - name: Build
      run: ./script/build-remote-server-illumos ${{ env.PROFILE == 'release' && '--release' || '' }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: zed-remote-server-illumos-x86_64-${{ env.PROFILE }}
        path: target/zed-remote-server-illumos-x86_64.gz
        if-no-files-found: error
  smoke_omnios:
    needs: build_illumos_remote_server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported LTS and the release the port was developed on.
        release:
        - r151054
        - r151058
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: zed-remote-server-illumos-x86_64-${{ env.PROFILE }}
    - uses: vmactions/omnios-vm@aeee92416495d9685b2997d954f6b063ae5b832d # v1.3.8
      with:
        release: ${{ matrix.release }}
        copyback: false
        # Reports whether libgcc_s ships in the base install before adding it.
        prepare: |
          pkg list system/library/gcc-runtime || pkg install system/library/gcc-runtime
        run: |
          set -e
          uname -a
          cat /etc/release
          gunzip -c zed-remote-server-illumos-x86_64.gz > remote-server
          chmod +x remote-server
          ldd remote-server
          ./remote-server version
